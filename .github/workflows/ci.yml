name: C++ CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            config: Debug
          - runner: ubuntu-24.04
            arch: x86_64
            config: Release
          - runner: ubuntu-24.04-arm
            arch: aarch64
            config: Release
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev nlohmann-json3-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package evidence
        run: |
          file build/dsh-mini
          ldd build/dsh-mini
          wc -c build/dsh-mini
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-mini-${{ matrix.arch }}-${{ matrix.config }}
          path: build/dsh-mini

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
